<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mugivara — Вики</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat+Alternates:wght@300;400;500;600;700;800;900&family=Exo+2:wght@300;400;500;600;700;800;900&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'system-ui', 'sans-serif'],
                        'game': ['Montserrat Alternates', 'sans-serif'],
                        'game-bold': ['Exo 2', 'sans-serif'],
                        'pixel': ['Pixelify Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Базовые стили */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Montserrat Alternates', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            background-color: #0a0a0a;
            color: #e5e5e5;
        }
        .pixel-font { font-family: 'Pixelify Sans', sans-serif; }
        .game-font { font-family: 'Montserrat Alternates', sans-serif; }
        .game-bold-font { font-family: 'Exo 2', sans-serif; }

        /* ===== КАСТОМНЫЙ СКРОЛЛБАР ===== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05)); border-radius: 10px; border: 1px solid rgba(255,255,255,0.04); }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, rgba(255,255,255,0.25), rgba(255,255,255,0.1)); }
        * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) rgba(255,255,255,0.02); }

        body.light ::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); }
        body.light ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.05)); border-color: rgba(0,0,0,0.04); }

        .nav-link { transition: all 0.2s ease; font-family: 'Montserrat Alternates', sans-serif; font-weight: 500; letter-spacing: 0.03em; }
        .nav-link:hover { color: #ffffff; transform: translateY(-1px); }

        .nav-btn {
            padding: 0.4rem 1.2rem;
            font-size: 0.75rem;
            border-radius: 9999px;
            font-weight: 500;
            letter-spacing: 0.03em;
            font-family: 'Montserrat Alternates', sans-serif;
        }
        .nav-btn-ip {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ccc;
        }
        .nav-btn-ip:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.25);
            color: #fff;
        }
        .nav-btn-discord {
            background: #5865F2;
            color: #fff;
            border: none;
        }
        .nav-btn-discord:hover {
            background: #4752C4;
        }

        .theme-toggle {
            transition: all 0.3s ease;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.12);
            color: #ccc;
            cursor: pointer;
        }
        .theme-toggle:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }

        /* Wiki Sidebar */
        .wiki-sidebar {
            background: #121212;
            transition: background-color 0.3s ease;
        }
        .wiki-sidebar::-webkit-scrollbar { width: 4px; }
        .wiki-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .nav-item {
            transition: all 0.2s ease;
            cursor: pointer;
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #a0a0a0;
            font-family: 'Montserrat Alternates', sans-serif;
        }
        .nav-item:hover {
            background: rgba(255,255,255,0.06);
            color: #ffffff;
        }
        .nav-item i {
            width: 20px;
            color: #666;
            transition: color 0.2s ease;
        }
        .nav-item:hover i { color: #fff; }
        .nav-active {
            background-color: #ffffff !important;
            color: #0a0a0a !important;
            font-weight: 600;
        }
        .nav-active i { color: #0a0a0a !important; }

        .sidebar-group { margin-bottom: 32px; }
        .sidebar-group:last-child { margin-bottom: 0; }
        .sidebar-group-title {
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: #555;
            margin-bottom: 10px;
            padding-left: 4px;
        }
        .sidebar-group ul { display: flex; flex-direction: column; gap: 2px; }

        body.light .nav-active {
            background-color: #222 !important;
            color: #f5f5f5 !important;
        }
        body.light .nav-active i { color: #f5f5f5 !important; }
        body.light .nav-item { color: #444; }
        body.light .nav-item:hover { background: rgba(0,0,0,0.06); color: #000; }
        body.light .nav-item i { color: #888; }
        body.light .nav-item:hover i { color: #000; }
        body.light .sidebar-group-title { color: #888; }
        body.light .wiki-sidebar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); }

        /* Wiki cards */
        .wiki-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .wiki-card:hover { transform: translateY(-6px); }

        /* Mobile menu */
        #mobile-menu {
            animation: slideDown 0.25s ease forwards;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Анимация появления */
        .section {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Glitch эффект для заголовка */
        .glitch-title {
            position: relative;
            animation: glitchText 3s infinite;
            font-family: 'Exo 2', sans-serif;
            font-weight: 800;
        }
        @keyframes glitchText {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-2px, 1px); }
            94% { transform: translate(2px, -1px); }
            96% { transform: translate(-1px, 2px); }
            98% { transform: translate(1px, -2px); }
        }

        .wiki-icon {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .wiki-card:hover .wiki-icon {
            transform: rotate(15deg) scale(1.1);
        }

        .game-heading {
            font-family: 'Montserrat Alternates', sans-serif;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        /* ===== СВЕТЛАЯ ТЕМА ===== */
        body.light {
            background-color: #f0f0f0;
            color: #1a1a1a;
        }
        body.light .bg-neutral-950 { background-color: #e8e8e8; }
        body.light .bg-neutral-900 { background-color: #dddddd; }
        body.light .bg-neutral-800 { background-color: #d0d0d0; }
        body.light .bg-black { background-color: #d5d5d5; }
        body.light .border-neutral-800 { border-color: #bbbbbb; }
        body.light .border-neutral-700 { border-color: #aaaaaa; }
        body.light .border-neutral-600 { border-color: #999999; }
        body.light .border-white\/10 { border-color: rgba(0,0,0,0.08); }
        body.light .border-white\/20 { border-color: rgba(0,0,0,0.15); }
        body.light .text-white { color: #111111 !important; }
        body.light .text-neutral-400 { color: #444444 !important; }
        body.light .text-neutral-500 { color: #555555 !important; }
        body.light .text-neutral-300 { color: #333333 !important; }
        body.light .text-neutral-200 { color: #222222 !important; }
        body.light .text-white\/80 { color: #333333 !important; }
        body.light .text-white\/70 { color: #444444 !important; }
        body.light .text-white\/90 { color: #222222 !important; }
        body.light .text-white\/60 { color: #444444 !important; }
        body.light .text-white\/40 { color: #666666 !important; }
        body.light .wiki-sidebar { 
            background: #d8d8d8 !important; 
            border-color: #bbbbbb !important; 
        }
        body.light #navbar { 
            background-color: rgba(235,235,235,0.95) !important; 
            border-color: #bbbbbb !important; 
        }
        body.light #navbar .text-white { color: #111111 !important; }
        body.light #navbar .text-neutral-300 { color: #333333 !important; }
        body.light #navbar .text-white\/80 { color: #333333 !important; }
        body.light #navbar .border-white\/10 { border-color: rgba(0,0,0,0.08) !important; }
        body.light .theme-toggle { 
            border-color: rgba(0,0,0,0.15) !important; 
            color: #333 !important; 
        }
        body.light .theme-toggle:hover { 
            background: rgba(0,0,0,0.06) !important; 
            color: #000 !important; 
        }
        body.light .nav-btn-ip {
            background: rgba(0,0,0,0.05) !important;
            border-color: rgba(0,0,0,0.1) !important;
            color: #333 !important;
        }
        body.light .nav-btn-ip:hover {
            background: rgba(0,0,0,0.1) !important;
            border-color: rgba(0,0,0,0.2) !important;
            color: #000 !important;
        }
        body.light .wiki-card { 
            background-color: #e0e0e0 !important; 
            border-color: #bbbbbb !important; 
        }
        body.light .wiki-card .text-white { color: #111111 !important; }
        body.light .wiki-card .text-neutral-300 { color: #333333 !important; }
        body.light .wiki-card .text-neutral-400 { color: #444444 !important; }
        body.light .wiki-card .text-white\/80 { color: #333333 !important; }
        body.light .wiki-card .text-white\/70 { color: #444444 !important; }
        body.light .wiki-card .text-white\/60 { color: #444444 !important; }
        body.light .bg-neutral-800 { background-color: #ccc !important; }
        body.light .bg-neutral-800:hover { background-color: #bbb !important; }
        body.light .bg-neutral-950\/95 { background-color: rgba(220,220,220,0.95) !important; }
        body.light .border-l-4 { border-color: #555 !important; }
        body.light #mobile-menu {
            background-color: #e8e8e8 !important;
            border-color: #bbbbbb !important;
        }
        body.light #mobile-menu .text-white { color: #111111 !important; }
        body.light #mobile-menu .border-neutral-800 { border-color: #bbbbbb !important; }
        body.light #mobile-menu .bg-neutral-800 { background-color: #ccc !important; }
        body.light #mobile-menu .bg-neutral-800:hover { background-color: #bbb !important; }
        body.light #mobile-menu .border-neutral-600 { border-color: #999 !important; }
        body.light .bg-white\/5 { background-color: rgba(0,0,0,0.05) !important; }
        body.light .text-white\/40 { color: #666666 !important; }
        body.light .text-white\/30 { color: #777777 !important; }
        body.light .cmd-block { 
            background: rgba(0,0,0,0.03) !important;
            border-color: rgba(0,0,0,0.06) !important;
        }
        body.light .cmd-block:hover {
            background: rgba(0,0,0,0.06) !important;
            border-color: rgba(0,0,0,0.15) !important;
        }
        body.light .cmd-code {
            background: rgba(0,0,0,0.06) !important;
            color: #111 !important;
        }
        body.light .bg-neutral-950 { background-color: #e8e8e8 !important; }

        .dot-pulse {
            animation: dotPulse 2s infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .cmd-block {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s ease;
        }
        .cmd-block:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.15);
            transform: translateX(4px);
        }
        .cmd-code {
            font-family: 'Exo 2', 'Monaco', monospace;
            font-size: 13px;
            background: rgba(255,255,255,0.05);
            padding: 2px 10px;
            border-radius: 6px;
            color: #fff;
        }

        .admin-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 20px;
            border-radius: 9999px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.15);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.03em;
            transition: all 0.4s ease;
            text-decoration: none;
            cursor: pointer;
            font-family: 'Montserrat Alternates', sans-serif;
        }
        .admin-link-btn:hover {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.35);
            border-color: rgba(255,255,255,0.08);
            transform: translateY(-1px);
        }
        body.light .admin-link-btn {
            background: rgba(0,0,0,0.02);
            border-color: rgba(0,0,0,0.04);
            color: rgba(0,0,0,0.15);
        }
        body.light .admin-link-btn:hover {
            background: rgba(0,0,0,0.04);
            color: rgba(0,0,0,0.3);
            border-color: rgba(0,0,0,0.08);
        }

        .game-bold-text {
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
        }

        .sync-btn {
            padding: 4px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: #888;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s ease;
            font-family: 'Montserrat Alternates', sans-serif;
        }
        .sync-btn:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
            border-color: rgba(255,255,255,0.12);
        }
        body.light .sync-btn {
            border-color: rgba(0,0,0,0.06);
            color: #666;
        }
        body.light .sync-btn:hover {
            background: rgba(0,0,0,0.04);
            color: #000;
            border-color: rgba(0,0,0,0.1);
        }

        .wiki-page-content ul {
            list-style: none;
            padding: 0;
        }
        .wiki-page-content ul li {
            padding: 8px 12px;
            margin: 4px 0;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            border-left: 3px solid rgba(255,255,255,0.1);
            font-family: 'Montserrat Alternates', sans-serif;
        }
        .wiki-page-content ul li:before {
            content: "•";
            color: #888;
            margin-right: 10px;
        }
        body.light .wiki-page-content ul li {
            background: rgba(0,0,0,0.02);
            border-left-color: rgba(0,0,0,0.1);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            animation: toastSlide 0.4s ease;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        @keyframes toastSlide {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .toast.success { background: rgba(78, 205, 196, 0.15); border: 1px solid rgba(78, 205, 196, 0.3); color: #4ecdc4; }
        .toast.error { background: rgba(255,107,107,0.15); border: 1px solid rgba(255,107,107,0.3); color: #ff6b6b; }
        .toast.info { background: rgba(255,170,68,0.15); border: 1px solid rgba(255,170,68,0.3); color: #ffaa44; }

        @media (max-width: 640px) {
            .screenshot-item {
                flex: 0 0 180px;
                height: 120px;
            }
            .screenshots-track {
                gap: 12px;
                animation-duration: 20s;
            }
            .screenshots-track-right {
                gap: 12px;
                animation-duration: 20s;
            }
            .admin-link-btn {
                padding: 4px 14px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body id="app-body">

    <!-- NAVBAR -->
    <nav id="navbar" class="fixed top-0 w-full bg-neutral-950/95 backdrop-blur-md border-b border-neutral-800 z-50 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-7 h-7 sm:w-8 sm:h-8 bg-white text-black rounded-xl flex items-center justify-center font-bold text-base sm:text-lg game-font">Z</div>
                <span class="game-font text-xl sm:text-2xl tracking-wider text-white font-bold">MUGIVARA</span>
            </div>

            <div class="hidden md:flex items-center gap-6 text-sm font-medium">
                <a href="index.html" class="text-white font-semibold nav-link">Главная</a>
                <a href="wiki.html" class="hover:text-white transition nav-link"><i class="fa-solid fa-book"></i> Вики</a>
                <a href="mapa.html" class="hover:text-white transition nav-link"><i class="fa-solid fa-map"></i> Карта</a>
                <a href="rules.html" class="hover:text-white transition nav-link"><i class="fa-solid fa-scroll"></i> Правила</a>
                <a href="apply.html" class="hover:text-white transition nav-link text-white/80"><i class="fa-solid fa-pen-to-square"></i> Заявка</a>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <div class="hidden sm:flex items-center gap-1.5 bg-neutral-900/60 px-3 py-1.5 rounded-full border border-white/10 text-xs">
                    <div class="w-1.5 h-1.5 bg-white rounded-full online-dot"></div>
                    <span class="font-medium text-white/80 game-font">Онлайн:</span>
                    <span id="online-count" class="font-semibold text-white game-font">Загрузка...</span>
                </div>

                <button id="themeToggle" class="theme-toggle w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center text-sm sm:text-base" aria-label="Переключить тему">
                    <i class="fa-regular fa-moon"></i>
                </button>

                <button onclick="copyIP()" class="nav-btn nav-btn-ip flex items-center gap-1.5">
                    <i class="fa-solid fa-copy text-xs"></i>
                    <span id="ip-text" class="hidden sm:inline">play.mugivaracraft.ru</span>
                    <span class="sm:hidden">IP</span>
                </button>
                
                <a href="https://discord.gg/W226UHyv6f" target="_blank" 
                   class="nav-btn nav-btn-discord flex items-center gap-1.5">
                    <i class="fa-brands fa-discord"></i> 
                    <span class="hidden sm:inline">DISCORD</span>
                </a>

                <button id="mobile-menu-button" class="md:hidden p-1.5 text-neutral-300 hover:text-white">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-neutral-950 border-t border-neutral-800 py-4 px-6">
            <div class="flex flex-col gap-3 text-base font-medium">
                <a href="index.html" class="text-white py-2 game-font">Главная</a>
                <a href="wiki.html" class="hover:text-white transition py-2 game-font"><i class="fa-solid fa-book w-5"></i> Вики</a>
                <a href="mapa.html" class="hover:text-white transition py-2 game-font"><i class="fa-solid fa-map w-5"></i> Карта</a>
                <a href="rules.html" class="hover:text-white transition py-2 game-font"><i class="fa-solid fa-scroll w-5"></i> Правила</a>
                <a href="apply.html" class="hover:text-white transition py-2 game-font"><i class="fa-solid fa-pen-to-square w-5"></i> Заявка</a>
                <div class="pt-3 border-t border-neutral-800">
                    <button onclick="copyIP()" class="w-full text-left px-4 py-2.5 bg-neutral-800 hover:bg-neutral-700 border border-neutral-600 rounded-full flex items-center gap-2 text-sm text-white game-font">
                        <i class="fa-solid fa-copy"></i>
                        <span>Скопировать IP: play.mugivaracraft.ru</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ====== ВИКИ ====== -->
    <div class="flex min-h-screen pt-16 lg:pt-20">
        <!-- Sidebar -->
        <div class="wiki-sidebar w-72 border-r border-neutral-800 p-6 hidden lg:block fixed h-[calc(100vh-4rem)] overflow-y-auto transition-colors duration-300">
            <div class="mb-8">
                <h1 class="text-2xl font-semibold text-white glitch-title"><i class="fa-solid fa-book mr-2"></i>ВИКИ</h1>
                <p class="text-sm text-neutral-500 game-font">Mugivara • 1.21.11</p>
                <div class="flex items-center gap-2 mt-2">
                    <span class="w-1.5 h-1.5 bg-green-400 rounded-full dot-pulse"></span>
                    <span class="text-xs text-neutral-500 game-font">База знаний обновлена</span>
                </div>
                <button onclick="loadAllWikiFromCloud()" class="sync-btn" style="margin-top:8px;">
                    <i class="fa-regular fa-cloud-arrow-down"></i> Обновить вики
                </button>
            </div>

            <div class="space-y-8" id="sidebarNav">
                <!-- Загружается через JS -->
            </div>
            
            <div class="mt-8 pt-6 border-t border-neutral-800">
                <div class="text-xs text-neutral-500 game-font">
                    <i class="fa-regular fa-clock"></i> Последнее обновление: <span id="update-date">сегодня</span>
                </div>
            </div>
        </div>

        <!-- Контент -->
        <div class="flex-1 lg:ml-72 p-4 sm:p-6 lg:p-10" id="wiki-content">
            <!-- Загружается через JS -->
        </div>
    </div>

    <!-- FOOTER с кнопкой админки -->
    <footer class="bg-black py-4 border-t border-neutral-800 transition-colors duration-300">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 text-center">
            <div class="flex justify-center">
                <a href="admin.html" class="admin-link-btn">
                    <i class="fa-regular fa-crown"></i>
                    <span>Управление сайтом</span>
                </a>
            </div>
        </div>
    </footer>

    <script>
        // ============================================================
        // ====== КОНФИГУРАЦИЯ JSONBin.io ======
        // ============================================================
        const JSONBIN_API_KEY = '$2a$10$URKtwmPsnoAKHj1hYcx0uuaUNwhJzV..m9zBM5rRKfsTFJYCJAFPe';
        const JSONBIN_BIN_ID = '6a5b75a4f5f4af5e29a06b2e';

        // ============================================================
        // ====== УНИВЕРСАЛЬНЫЕ ФУНКЦИИ ======
        // ============================================================
        
        function copyIP() {
            navigator.clipboard.writeText("play.mugivaracraft.ru").then(() => {
                const el = document.getElementById("ip-text");
                const old = el.textContent;
                el.textContent = "СКОПИРОВАНО ✓";
                setTimeout(() => {
                    if (el.classList.contains('hidden')) {
                        document.getElementById("ip-text").textContent = "IP";
                    } else {
                        el.textContent = old;
                    }
                }, 2000);
            });
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const btn = document.getElementById('mobile-menu-button');
            const icon = btn.querySelector('i');
            menu.classList.toggle('hidden');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-times');
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.querySelector('#themeToggle i');
            body.classList.toggle('light');
            if (body.classList.contains('light')) {
                icon.className = 'fa-regular fa-sun';
                localStorage.setItem('theme', 'light');
            } else {
                icon.className = 'fa-regular fa-moon';
                localStorage.setItem('theme', 'dark');
            }
        }

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        // ============================================================
        // ====== ВИКИ ======
        // ============================================================
        let wikiSections = [];
        let currentPage = 'home';
        let sectionsMap = {};

        function loadWikiFromStorage() {
            try {
                const data = localStorage.getItem('admin_wiki_sections');
                if (data) {
                    wikiSections = JSON.parse(data);
                    sectionsMap = {};
                    wikiSections.forEach(s => { sectionsMap[s.id] = s; });
                    return true;
                }
            } catch (e) {}
            return false;
        }

        function getDefaultWikiSections() {
            return [
                { id: 'home', title: 'Главная', items: ['Добро пожаловать в вику Mugivara!', 'Здесь собрана вся полезная информация для комфортной игры.'] },
                { id: 'resourcepacks', title: 'Ресурс-паки', items: ['Vanilla Tweaks — лучший выбор для ванильного сервера', 'Faithful 32x — классические текстуры в высоком разрешении'] },
                { id: 'mods', title: 'Моды для клиента', items: ['Sodium + Iris — FPS и шейдеры', "Xaero's Minimap — мини-карта", 'AppleSkin — информация о еде'] },
                { id: 'claims', title: 'Метки на карте', items: ['Поставьте баннер в нужном месте', 'Переименуйте его в анвиле', 'Метка автоматически появится на Dynmap'] },
                { id: 'commands', title: 'Полезные команды', items: ['/skin ник — поставить скин', '/co i — режим Шерлока', '/ping — узнать пинг'] },
                { id: 'tips', title: 'Советы новичкам', items: ['Начните с базы рядом со спавном', 'Общайтесь с соседями — помогайте друг другу!', 'Используйте Dynmap для навигации'] }
            ];
        }

        function saveWikiToStorage() {
            try {
                localStorage.setItem('admin_wiki_sections', JSON.stringify(wikiSections));
            } catch (e) {}
        }

        // Загрузка вики из облака
        async function loadAllWikiFromCloud() {
            const btn = event?.target;
            const originalText = btn ? btn.innerHTML : '';
            if (btn) {
                btn.innerHTML = '<i class="fa-regular fa-spinner fa-spin"></i> Загрузка...';
                btn.disabled = true;
            }

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });

                if (!response.ok) throw new Error('Ошибка загрузки');

                const data = await response.json();
                const cloudData = data.record;

                if (cloudData && cloudData.wikiSections) {
                    localStorage.setItem('admin_wiki_sections', JSON.stringify(cloudData.wikiSections));
                    localStorage.setItem('mugivara_last_update', Date.now().toString());
                    const loaded = loadWikiFromStorage();
                    if (loaded) {
                        renderSidebar();
                        const navItem = document.querySelector(`.nav-item[data-page="${currentPage}"]`);
                        loadWikiPage(currentPage, navItem);
                        showToast('✅ Вики обновлена из облака', 'success');
                    }
                } else {
                    showToast('ℹ️ В облаке нет данных вики', 'info');
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки:', error);
                showToast('⚠️ Ошибка загрузки вики', 'error');
            }

            if (btn) {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Автоматическая проверка обновлений
        async function checkWikiUpdates() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });

                if (!response.ok) return;

                const data = await response.json();
                const cloudData = data.record;

                if (cloudData && cloudData.updated) {
                    const cloudTime = new Date(cloudData.updated).getTime();
                    const localTime = parseInt(localStorage.getItem('mugivara_last_update') || '0');

                    if (cloudTime > localTime && cloudData.wikiSections) {
                        console.log('🔄 Найдены обновления вики в облаке');
                        localStorage.setItem('admin_wiki_sections', JSON.stringify(cloudData.wikiSections));
                        localStorage.setItem('mugivara_last_update', Date.now().toString());
                        const loaded = loadWikiFromStorage();
                        if (loaded) {
                            renderSidebar();
                            const navItem = document.querySelector(`.nav-item[data-page="${currentPage}"]`);
                            loadWikiPage(currentPage, navItem);
                            showToast('🔄 Вики обновлена из облака', 'info');
                        }
                    }
                }
            } catch (error) {
                console.warn('⚠️ Ошибка проверки обновлений:', error);
            }
        }

        function initWiki() {
            const loaded = loadWikiFromStorage();
            if (!loaded) {
                wikiSections = getDefaultWikiSections();
                sectionsMap = {};
                wikiSections.forEach(s => { sectionsMap[s.id] = s; });
                saveWikiToStorage();
            }
            renderSidebar();
            
            const urlParams = new URLSearchParams(window.location.search);
            const pageParam = urlParams.get('page');
            if (pageParam && sectionsMap[pageParam]) {
                currentPage = pageParam;
            } else {
                currentPage = 'home';
            }
            
            loadWikiPage(currentPage);
            
            document.querySelectorAll('.nav-item').forEach(el => {
                if (el.dataset.page === currentPage) {
                    el.classList.add('nav-active');
                }
            });
            
            const dateEl = document.getElementById('update-date');
            if (dateEl) {
                const now = new Date();
                dateEl.textContent = now.toLocaleDateString('ru-RU', { 
                    day: 'numeric', month: 'long', year: 'numeric' 
                });
            }
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            const groups = {
                'Основное': ['home'],
                'Рекомендации': ['resourcepacks', 'mods'],
                'Геймплей': ['claims', 'commands', 'tips']
            };
            
            const icons = {
                'home': 'fa-solid fa-house',
                'resourcepacks': 'fa-solid fa-palette',
                'mods': 'fa-solid fa-puzzle-piece',
                'claims': 'fa-solid fa-map-pin',
                'commands': 'fa-solid fa-terminal',
                'tips': 'fa-solid fa-lightbulb'
            };

            let html = '';
            for (const [groupName, ids] of Object.entries(groups)) {
                html += `<div class="sidebar-group">`;
                html += `<div class="sidebar-group-title">${groupName}</div>`;
                html += `<ul>`;
                for (const id of ids) {
                    const section = sectionsMap[id];
                    if (section) {
                        const icon = icons[id] || 'fa-solid fa-circle';
                        html += `<li><a href="#" onclick="loadWikiPage('${id}', this); return false;" class="nav-item" data-page="${id}"><i class="${icon}"></i> ${section.title}</a></li>`;
                    }
                }
                html += `</ul></div>`;
            }
            nav.innerHTML = html;
        }

        function loadWikiPage(page, element = null) {
            const content = document.getElementById('wiki-content');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('nav-active'));
            if (element) {
                element.classList.add('nav-active');
                const sidebar = document.querySelector('.wiki-sidebar');
                if (sidebar) {
                    const rect = element.getBoundingClientRect();
                    const sidebarRect = sidebar.getBoundingClientRect();
                    if (rect.top < sidebarRect.top || rect.bottom > sidebarRect.bottom) {
                        element.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    }
                }
            } else {
                const navItem = document.querySelector(`.nav-item[data-page="${page}"]`);
                if (navItem) navItem.classList.add('nav-active');
            }

            currentPage = page;

            content.style.opacity = '0';
            content.style.transform = 'translateY(20px)';
            setTimeout(() => {
                content.innerHTML = getWikiContent(page);
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
                content.style.transition = 'all 0.4s ease';
            }, 150);
        }

        function getWikiContent(pageId) {
            const section = sectionsMap[pageId];
            if (!section) {
                return `<div class="max-w-3xl"><div class="bg-neutral-900 border border-neutral-700 rounded-2xl p-8"><p class="text-neutral-400">Раздел не найден</p></div></div>`;
            }

            const items = section.items || [];
            const itemsHtml = items.length > 0 
                ? `<ul>${items.map(item => `<li>${item}</li>`).join('')}</ul>`
                : '<p class="text-neutral-400">Пункты отсутствуют</p>';

            let extraHtml = '';
            if (pageId === 'home') {
                const cards = [
                    { id: 'resourcepacks', icon: 'fa-solid fa-palette', title: 'Ресурс-паки', desc: 'Улучши визуал' },
                    { id: 'mods', icon: 'fa-solid fa-puzzle-piece', title: 'Моды', desc: 'Оптимизация и удобства' },
                    { id: 'commands', icon: 'fa-solid fa-terminal', title: 'Команды', desc: 'Полезные штуки' },
                    { id: 'tips', icon: 'fa-solid fa-lightbulb', title: 'Советы', desc: 'Для новичков' }
                ];
                extraHtml = `<div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4">
                    ${cards.map(c => `
                        <div onclick="loadWikiPage('${c.id}', document.querySelector('.nav-item[data-page="${c.id}"]'))" class="wiki-card cursor-pointer bg-neutral-950 p-6 rounded-2xl border border-neutral-700 hover:border-white/30 transition-all">
                            <div class="wiki-icon text-3xl mb-3"><i class="${c.icon}"></i></div>
                            <h3 class="text-lg font-semibold text-white game-font">${c.title}</h3>
                            <p class="text-sm text-neutral-400 mt-1 game-font">${c.desc}</p>
                        </div>
                    `).join('')}
                </div>`;
            }

            return `
                <div class="max-w-3xl wiki-page-content">
                    <div class="bg-neutral-900 border border-neutral-700 rounded-2xl p-8 sm:p-10">
                        <h1 class="text-3xl sm:text-4xl font-semibold text-white mb-6 game-heading">${section.title}</h1>
                        <div class="text-neutral-300 leading-relaxed game-font">
                            ${itemsHtml}
                        </div>
                        ${extraHtml}
                        <div class="mt-6 text-xs text-neutral-500 flex items-center gap-2 border-t border-neutral-700 pt-4 game-font">
                            <i class="fa-regular fa-circle-check text-green-400"></i>
                            <span>Синхронизировано с облаком</span>
                            <span class="text-neutral-600 ml-2">•</span>
                            <span>ID: ${section.id}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        async function updateOnline() {
            const el = document.getElementById('online-count');
            try {
                const resp = await fetch('https://api.mcstatus.io/v2/status/java/mc.mugivaracraft.ru', {
                    signal: AbortSignal.timeout(4000)
                });
                const data = await resp.json();
                if (data.online) {
                    el.textContent = `${data.players.online}/${data.players.max}`;
                    el.className = "font-semibold text-white game-font";
                } else {
                    el.textContent = "0/100";
                    el.className = "font-semibold text-neutral-500 game-font";
                }
            } catch {
                el.textContent = "—";
                el.className = "font-semibold text-neutral-500 game-font";
            }
        }

        // ============================================================
        // ====== ИНИЦИАЛИЗАЦИЯ ======
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.querySelector('#themeToggle i');
            if (savedTheme === 'light') {
                document.body.classList.add('light');
                icon.className = 'fa-regular fa-sun';
            } else {
                icon.className = 'fa-regular fa-moon';
            }

            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('mobile-menu-button').addEventListener('click', toggleMobileMenu);

            // Инициализация вики
            initWiki();
            
            const dateEl = document.getElementById('update-date');
            if (dateEl) {
                const now = new Date();
                dateEl.textContent = now.toLocaleDateString('ru-RU', { 
                    day: 'numeric', month: 'long', year: 'numeric' 
                });
            }

            // Онлайн
            setTimeout(updateOnline, 300);
            setInterval(updateOnline, 10000);

            // Проверка обновлений из облака
            setTimeout(checkWikiUpdates, 3000);
            setInterval(checkWikiUpdates, 30000);
        });
    </script>
</body>
</html>
