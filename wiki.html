    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'inter': ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: '#0099CC',
                        brandLight: '#EAEAEA',
                        brandDark: '#333333',
                        brandBg: '#FDFBF8',
                    }
                }

        }

    <style>
        /* ===== БАЗА ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #FDFBF8;
            color: #333333;
            font-weight: 400;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #EAEAEA; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #0099CC; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #0077A3; }
        * { scrollbar-width: thin; scrollbar-color: #0099CC #EAEAEA; }

        /* ===== НАВБАР ===== */
        #navbar {
            background: rgba(253, 251, 248, 0.55) !important;
            backdrop-filter: blur(30px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(30px) saturate(180%) !important;
            border-bottom: 1px solid rgba(0, 153, 204, 0.15) !important;
            box-shadow: 0 4px 30px rgba(0,0,0,0.03) !important;
            z-index: 50 !important;
        }
        #navbar .text-white { color: #333333 !important; }
        #navbar .text-neutral-300 { color: #333333 !important; }
        #navbar .text-white\/80 { color: #555555 !important; }
        #navbar .border-white\/10 { border-color: rgba(0,153,204,0.08) !important; }

        .nav-link {
            color: #555555 !important;
            transition: all 0.2s ease;
            font-weight: 500;
            letter-spacing: 0.03em;
        }
        .nav-link:hover {
            color: #0099CC !important;
            transform: translateY(-1px);
        }
        .nav-link.text-white\/80 { color: #555555 !important; }
        .nav-link.text-white\/80:hover { color: #0099CC !important; }

        .nav-btn {
            padding: 0.4rem 1.2rem;
            font-size: 0.75rem;
            border-radius: 9999px;
            font-weight: 500;
            letter-spacing: 0.03em;
            font-family: 'Inter', system-ui, sans-serif;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .nav-btn-ip {
            background: rgba(0,153,204,0.08);
            border-color: rgba(0,153,204,0.12);
            color: #333333;
        }
        .nav-btn-ip:hover {
            background: rgba(0,153,204,0.15);
            border-color: #0099CC;
            color: #0099CC;
        }
        .nav-btn-discord {
            background: #5865F2;
            color: #fff;
            border: none;
        }
        .nav-btn-discord:hover {
            background: #4752C4;
        }
        .theme-toggle { display: none !important; }

        #mobile-menu {
            background: rgba(253, 251, 248, 0.92) !important;
            backdrop-filter: blur(30px) saturate(180%) !important;
            border-top: 1px solid rgba(0,153,204,0.08) !important;
        }
        #mobile-menu .text-white { color: #333333 !important; }
        #mobile-menu .border-neutral-800 { border-color: #EAEAEA !important; }
        #mobile-menu .bg-neutral-800 { background-color: rgba(0,153,204,0.05) !important; }
        #mobile-menu .bg-neutral-800:hover { background-color: rgba(0,153,204,0.12) !important; }
        #mobile-menu .border-neutral-600 { border-color: #CCCCCC !important; }

        .logo-z {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: #FFFFFF;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0,153,204,0.15), 0 2px 6px rgba(0,0,0,0.04);
            font-size: 28px;
            font-weight: 800;
            color: #0099CC;
            transition: transform 0.2s ease;
            line-height: 1;
        }
        .logo-z:hover { transform: scale(1.05); }

        .online-dot {
            animation: pulse-dot 2s infinite;
            background-color: #0099CC;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ===== САЙДБАР ===== */
        .wiki-sidebar {
            position: fixed;
            top: 4rem;
            left: 0;
            bottom: 0;

            background: rgba(253, 251, 248, 0.7);
            backdrop-filter: blur(20px) saturate(180%);

        .sidebar-group { margin-bottom: 32px; }

            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: #0099CC;
            margin-bottom: 10px;
            padding-left: 4px;
        }
        .sidebar-group ul { display: flex; flex-direction: column; gap: 2px; }

        .nav-item {
            transition: all 0.2s ease;
            cursor: pointer;
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666666;
            font-family: 'Inter', system-ui, sans-serif;
            font-weight: 400;
            text-decoration: none;
        }
        .nav-item:hover {
            background: rgba(0,153,204,0.06);
            color: #0099CC;
        }
        .nav-item i { width: 20px; color: #999; transition: color 0.2s ease; }
        .nav-item:hover i { color: #0099CC; }
        .nav-active {
            background: #0099CC !important;
            color: #FFFFFF !important;
            font-weight: 500;
        }
        .nav-active i { color: #FFFFFF !important; }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .wiki-main-wrapper {
            display: flex;
            min-height: 100vh;
            padding-top: 6.5rem;      /* увеличенный отступ, чтобы контент не перекрывал навбар */
            padding-bottom: 0;
            position: relative;
            z-index: 10;
        }
        @media (min-width: 1024px) {
            .wiki-main-wrapper { padding-left: 18rem; }
        }

        .glass-card {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,153,204,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.03);
            transition: all 0.4s ease;
            border-radius: 16px;
        }
        .glass-card:hover {
            border-color: #0099CC;
            transform: translateY(-4px);
            box-shadow: 0 12px 48px rgba(0,153,204,0.08);
        }

        .wiki-page-content ul {
            list-style: none;
            padding: 0;
        }
        .wiki-page-content ul li {
            padding: 10px 14px;
            margin: 6px 0;
            background: rgba(0,153,204,0.03);
            border-radius: 10px;
            border-left: 3px solid rgba(0,153,204,0.2);

            margin-right: 10px;
            font-weight: 700;

        }
        .wiki-card:hover {
            transform: translateY(-6px);

        }

        .sync-btn {
            padding: 4px 14px;
            border-radius: 8px;
            border: 1px solid rgba(0,153,204,0.12);
            background: rgba(0,153,204,0.04);
            color: #777;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s ease;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .sync-btn:hover {
            background: rgba(0,153,204,0.08);
            color: #0099CC;
            border-color: #0099CC;
        }

        /* ===== МОБИЛЬНЫЙ САЙДБАР ===== */
        .burger-btn {
            display: none;
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(253, 251, 248, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,153,204,0.08);
            border-radius: 12px;
            padding: 8px 20px;
            color: #333;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Inter', system-ui, sans-serif;
            transition: all 0.3s ease;
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }
        .burger-btn:hover {
            background: #FFFFFF;
            color: #0099CC;
            border-color: #0099CC;
        }

        .mobile-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.2);
            z-index: 40;
            backdrop-filter: blur(4px);
        }
        .mobile-overlay.active { display: block; }

        .mobile-sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100vh;
            background: rgba(253, 251, 248, 0.95);
            backdrop-filter: blur(30px);
            z-index: 50;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            padding: 24px 20px;
            border-right: 1px solid rgba(0,153,204,0.08);
        }
        .mobile-sidebar.open { left: 0; }
        .mobile-sidebar::-webkit-scrollbar { width: 4px; }
        .mobile-sidebar::-webkit-scrollbar-thumb { background: #0099CC; border-radius: 10px; }

        .mobile-sidebar .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0,153,204,0.08);
        }
        .mobile-sidebar .sidebar-header h2 {
            color: #333;
            font-size: 18px;
            font-weight: 600;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .mobile-sidebar .close-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
        }
        .mobile-sidebar .close-btn:hover { color: #0099CC; }
        .mobile-sidebar .sidebar-group { margin-bottom: 24px; }
        .mobile-sidebar .sidebar-group-title {
            font-size: 0.6rem;
            color: #0099CC;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            font-weight: 600;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .mobile-sidebar .nav-item {
            padding: 8px 14px;
            font-size: 14px;
            border-radius: 8px;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .mobile-sidebar .nav-item i { font-size: 14px; width: 18px; }

        @media (max-width: 1024px) {
            .wiki-sidebar { display: none !important; }
            .wiki-main-wrapper { padding-left: 0 !important; }
            .burger-btn { display: inline-flex !important; }
            .mobile-overlay.active { display: block; }
        }
        @media (max-width: 640px) {
            .burger-btn { top: 64px; padding: 6px 16px; font-size: 12px; }
            .mobile-sidebar { width: 280px; left: -300px; }
            .wiki-main-wrapper { padding-top: 5.5rem; } /* чуть меньше на мобилках, но всё равно достаточно */
        }

        .icon-fw { width: 1.25em; text-align: center; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            animation: toastSlide 0.4s ease;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            font-family: 'Inter', system-ui, sans-serif;
        }
        @keyframes toastSlide {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .toast.success { background: #E6F7F0; border: 1px solid #0099CC; color: #0077A3; }
        .toast.error { background: #FDE8E8; border: 1px solid #FF6B6B; color: #CC3333; }
        .toast.info { background: #FFF4E6; border: 1px solid #FFAA44; color: #995522; }
    </style>
</head>

    <script>
        // ============================================================
        // ====== КОНФИГУРАЦИЯ JSONBin ======
        // ============================================================
        const JSONBIN_API_KEY = '$2a$10$URKtwmPsnoAKHj1hYcx0uuaUNwhJzV..m9zBM5rRKfsTFJYCJAFPe';
        const JSONBIN_BIN_ID = '6a5b75a4f5f4af5e29a06b2e';

        // ============================================================
        // ====== УНИВЕРСАЛЬНЫЕ ФУНКЦИИ ======
        // ============================================================
        function copyIP() {
            navigator.clipboard.writeText("play.mugivaracraft.ru").then(() => {
                const el = document.getElementById("ip-text");
                const old = el.textContent;
                el.textContent = "СКОПИРОВАНО ✓";
                setTimeout(() => {
                    if (el.classList.contains('hidden')) {
                        document.getElementById("ip-text").textContent = "IP";
                    } else {
                        el.textContent = old;
                    }
                }, 2000);
            });
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const btn = document.getElementById('mobile-menu-button');
            const icon = btn.querySelector('i');
            menu.classList.toggle('hidden');
            icon.className = menu.classList.contains('hidden') ? 'fas fa-bars text-xl' : 'fas fa-times text-xl';
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('mobileSidebar');
            const overlay = document.getElementById('mobileOverlay');
            const icon = document.getElementById('burgerIcon');
            const label = document.getElementById('burgerLabel');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
            document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : '';
            if (sidebar.classList.contains('open')) {
                icon.className = 'fas fa-times';
                label.textContent = 'Закрыть';
            } else {
                icon.className = 'fas fa-bars';
                label.textContent = 'Меню';
            }
        }

        function closeMobileSidebar() {
            const sidebar = document.getElementById('mobileSidebar');
            const overlay = document.getElementById('mobileOverlay');
            const icon = document.getElementById('burgerIcon');
            const label = document.getElementById('burgerLabel');
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            icon.className = 'fas fa-bars';
            label.textContent = 'Меню';
        }

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        // ============================================================
        // ====== ВИКИ ======
        // ============================================================
        let wikiCategories = [];
        let currentPage = 'home';
        let sectionsMap = {};

        function loadWikiFromStorage() {
            try {
                const mainData = localStorage.getItem('mugivara_main_data');
                if (mainData) {
                    const data = JSON.parse(mainData);
                    if (data.wikiCategories && data.wikiCategories.length > 0) {
                        wikiCategories = data.wikiCategories;
                        buildSectionsMap();
                        return true;
                    }
                }
            } catch (e) {}
            try {
                const data = localStorage.getItem('wiki_categories');
                if (data) {
                    wikiCategories = JSON.parse(data);
                    buildSectionsMap();
                    return true;
                }
            } catch (e) {}
            return false;
        }

        function buildSectionsMap() {
            sectionsMap = {};
            wikiCategories.forEach(cat => {
                (cat.sections || []).forEach(sec => {
                    sectionsMap[sec.id] = sec;
                    sec.categoryTitle = cat.title;
                });
            });
        }

        function getDefaultWikiCategories() {
            return [
                {
                    id: 'cat1',
                    title: 'Основное',
                    sections: [
                        { id: 'home', title: 'Главная', items: [
                            'Добро пожаловать в вики Mugivara!',
                            'Здесь собрана вся полезная информация для комфортной игры.',
                            'Сервер создан для тех, кто ценит настоящее ванильное выживание.'
                        ] }
                    ]
                },
                {
                    id: 'cat2',
                    title: 'Визуал',
                    sections: [
                        { id: 'resourcepacks', title: 'Ресурс-паки', items: [
                            'Vanilla Tweaks — улучшает текстуры, звуки и добавляет удобства.',
                            'Faithful 32x — классические текстуры в высоком разрешении.',
                            'Bare Bones — минималистичный пак для максимальной производительности.'
                        ] }
                    ]
                },
                {
                    id: 'cat3',
                    title: 'Клиент',
                    sections: [
                        { id: 'mods', title: 'Рекомендуемые моды (Fabric 1.21.11)', items: [
                            'Sodium — прирост FPS без потери качества.',
                            'Iris Shaders — шейдеры вместе с Sodium.',
                            'Xaero\'s Minimap — мини-карта с метками.',
                            'AppleSkin — информация о насыщении от еды.',
                            'ReplayMod — запись игровых повторов.',
                            'Entity Culling — оптимизация FPS.'
                        ] }
                    ]
                },
                {
                    id: 'cat4',
                    title: 'Геймплей',
                    sections: [
                        { id: 'claims', title: 'Метки на карте', items: [
                            'Поставьте баннер в нужном месте на карте мира.',
                            'Переименуйте его в анвиле — это название будет отображаться на карте.',
                            'Метка автоматически появится на Dynmap через несколько секунд.'
                        ] },
                        { id: 'commands', title: 'Полезные команды', items: [
                            '/skin ник — поставить скин (даже без лицензии!)',
                            '/cd create remote "ссылка" "имя" — создать кастомную пластинку',
                            '/co i — режим Шерлока Холмса',
                            '/ping — узнать пинг до сервера',
                            '/msg ник текст — личное сообщение'
                        ] },
                        { id: 'tips', title: 'Советы новичкам', items: [
                            'Начните с базы рядом со спавном — так будет проще ориентироваться.',
                            'Постройте автоматические фермы для еды, дерева и железа.',
                            'Общайтесь с соседями! На сервере дружелюбное комьюнити.',
                            'Используйте Dynmap для навигации — это онлайн-карта мира.'
                        ] }
                    ]
                }
            ];
        }

        function saveWikiToStorage() {
            try {
                localStorage.setItem('wiki_categories', JSON.stringify(wikiCategories));
                const mainData = localStorage.getItem('mugivara_main_data');
                let data = mainData ? JSON.parse(mainData) : {};
                data.wikiCategories = wikiCategories;
                localStorage.setItem('mugivara_main_data', JSON.stringify(data));
            } catch (e) {}
        }

        async function loadAllWikiFromCloud() {
            const btn = event?.target;
            const originalText = btn ? btn.innerHTML : '';
            if (btn) {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                btn.disabled = true;
            }
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                if (!response.ok) throw new Error('Ошибка загрузки');
                const data = await response.json();
                const cloudData = data.record;
                if (cloudData && cloudData.wikiCategories && cloudData.wikiCategories.length > 0) {
                    wikiCategories = cloudData.wikiCategories;
                    localStorage.setItem('wiki_categories', JSON.stringify(wikiCategories));
                    const mainData = localStorage.getItem('mugivara_main_data');
                    let main = mainData ? JSON.parse(mainData) : {};
                    main.wikiCategories = wikiCategories;
                    localStorage.setItem('mugivara_main_data', JSON.stringify(main));
                    localStorage.setItem('mugivara_last_update', Date.now().toString());
                    buildSectionsMap();
                    renderAllSidebars();
                    loadFirstAvailablePage();
                    showToast('✅ Вики обновлена из облака', 'success');
                } else {
                    showToast('ℹ️ В облаке нет данных вики', 'info');
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки:', error);
                showToast('⚠️ Ошибка загрузки вики', 'error');
            }
            if (btn) {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function loadFirstAvailablePage() {
            if (wikiCategories.length > 0) {
                const firstCat = wikiCategories[0];
                if (firstCat.sections && firstCat.sections.length > 0) {
                    const firstSec = firstCat.sections[0];
                    currentPage = firstSec.id;
                    loadWikiPage(firstSec.id);
                    return;
                }
            }
            if (sectionsMap['home']) {
                currentPage = 'home';
                loadWikiPage('home');
            }
        }

        async function checkWikiUpdates() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                if (!response.ok) return;
                const data = await response.json();
                const cloudData = data.record;
                if (cloudData && cloudData.updated) {
                    const cloudTime = new Date(cloudData.updated).getTime();
                    const localTime = parseInt(localStorage.getItem('mugivara_last_update') || '0');
                    if (cloudTime > localTime && cloudData.wikiCategories && cloudData.wikiCategories.length > 0) {
                        console.log('🔄 Найдены обновления вики в облаке');
                        wikiCategories = cloudData.wikiCategories;
                        localStorage.setItem('wiki_categories', JSON.stringify(wikiCategories));
                        const mainData = localStorage.getItem('mugivara_main_data');
                        let main = mainData ? JSON.parse(mainData) : {};
                        main.wikiCategories = wikiCategories;
                        localStorage.setItem('mugivara_main_data', JSON.stringify(main));
                        localStorage.setItem('mugivara_last_update', Date.now().toString());
                        buildSectionsMap();
                        renderAllSidebars();
                        loadFirstAvailablePage();
                        showToast('🔄 Вики обновлена из облака', 'info');
                    }
                }
            } catch (error) {
                console.warn('⚠️ Ошибка проверки обновлений:', error);
            }
        }

        function initWiki() {
            const loaded = loadWikiFromStorage();
            if (!loaded) {
                wikiCategories = getDefaultWikiCategories();
                buildSectionsMap();
                saveWikiToStorage();
            }
            renderAllSidebars();
            loadFirstAvailablePage();
            const date = new Date();
            const dateStr = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('update-date').textContent = dateStr;
            document.getElementById('mobile-update-date').textContent = dateStr;
        }

        function renderAllSidebars() {
            renderDesktopSidebar();
            renderMobileSidebar();
        }

        function renderDesktopSidebar() {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = buildSidebarHTML(false);
        }

        function renderMobileSidebar() {
            const nav = document.getElementById('mobileSidebarNav');
            nav.innerHTML = buildSidebarHTML(true);
        }

        function buildSidebarHTML(isMobile = false) {
            let html = '';
            wikiCategories.forEach(cat => {
                if (!cat.sections || cat.sections.length === 0) return;
                html += `<div class="sidebar-group">`;
                html += `<div class="sidebar-group-title">${cat.title}</div>`;
                html += `<ul>`;
                (cat.sections || []).forEach(sec => {
                    const icon = getSectionIcon(sec.id);
                    const isActive = currentPage === sec.id;
                    html += `<li><a href="#" onclick="loadWikiPage('${sec.id}'); return false;" class="nav-item ${isActive ? 'nav-active' : ''}" data-page="${sec.id}"><i class="${icon}"></i> ${sec.title}</a></li>`;
                });
                html += `</ul></div>`;
            });
            return html;
        }

        function getSectionIcon(id) {
            const icons = {
                'home': 'fas fa-home',
                'resourcepacks': 'fas fa-palette',
                'mods': 'fas fa-puzzle-piece',
                'claims': 'fas fa-map-pin',
                'commands': 'fas fa-terminal',
                'tips': 'fas fa-lightbulb'
            };
            return icons[id] || 'fas fa-circle';
        }

        function loadWikiPage(page) {
            const content = document.getElementById('wiki-content');
            if (!sectionsMap[page]) {
                content.innerHTML = `
                    <div class="glass-card p-8 text-center">
                        <p class="text-dark/50">Раздел не найден</p>
                        <button onclick="loadFirstAvailablePage()" class="sync-btn mt-4">Вернуться на главную</button>
                    </div>
                `;
                return;
            }
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('nav-active'));
            document.querySelectorAll(`.nav-item[data-page="${page}"]`).forEach(el => el.classList.add('nav-active'));
            currentPage = page;
            closeMobileSidebar();
            content.style.opacity = '0';
            content.style.transform = 'translateY(20px)';
            setTimeout(() => {
                content.innerHTML = getWikiContent(page);
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
                content.style.transition = 'all 0.4s ease';
            }, 150);
        }

        function getWikiContent(pageId) {
            const section = sectionsMap[pageId];
            if (!section) {
                return `<div class="glass-card p-8 text-center"><p class="text-dark/50">Раздел не найден</p></div>`;
            }
            const items = section.items || [];
            const itemsHtml = items.length > 0
                ? `<ul>${items.map(item => {
                    const formatted = item.replace(/\n/g, '<br>');
                    return `<li>${formatted}</li>`;
                }).join('')}</ul>`
                : '<p class="text-dark/40">Пункты отсутствуют</p>';

            let extraHtml = '';
            if (pageId === 'home') {
                const cards = [
                    { id: 'resourcepacks', icon: 'fas fa-palette', title: 'Ресурс-паки', desc: 'Улучши визуал' },
                    { id: 'mods', icon: 'fas fa-puzzle-piece', title: 'Моды', desc: 'Оптимизация и удобства' },
                    { id: 'commands', icon: 'fas fa-terminal', title: 'Команды', desc: 'Полезные штуки' },
                    { id: 'tips', icon: 'fas fa-lightbulb', title: 'Советы', desc: 'Для новичков' }
                ];
                extraHtml = `<div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4">
                    ${cards.map(c => `
                        <div onclick="loadWikiPage('${c.id}')" class="wiki-card glass-card p-6 transition-all">
                            <div class="text-3xl text-brand/60 mb-3"><i class="${c.icon}"></i></div>
                            <h3 class="text-lg font-semibold text-dark">${c.title}</h3>
                            <p class="text-sm text-dark/40 mt-1">${c.desc}</p>
                        </div>
                    `).join('')}
                </div>`;
            }

            return `
                <div class="wiki-page-content">
                    <div class="glass-card p-8 sm:p-10">
                        <h1 class="text-3xl sm:text-4xl font-semibold text-dark mb-6">${section.title}</h1>
                        <div class="text-dark/70 leading-relaxed">
                            ${itemsHtml}
                        </div>
                        ${extraHtml}
                        <div class="mt-6 text-xs text-dark/30 flex items-center gap-2 border-t border-brandLight pt-4">
                            <i class="fas fa-check-circle text-brand"></i>
                            <span>Синхронизировано с облаком</span>
                            <span class="text-dark/20 ml-2">•</span>
                            <span>Категория: ${section.categoryTitle || 'Без категории'}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // ===== ОНЛАЙН =====
        async function updateOnline() {
            const el = document.getElementById('online-count');
            try {
                const resp = await fetch('https://api.mcstatus.io/v2/status/java/mc.mugivaracraft.ru', {
                    signal: AbortSignal.timeout(4000)
                });
                const data = await resp.json();
                if (data.online) {
                    el.textContent = `${data.players.online}/${data.players.max}`;
                    el.className = "font-semibold text-dark";
                } else {
                    el.textContent = "0/100";
                    el.className = "font-semibold text-dark/40";
                }
            } catch {
                el.textContent = "—";
                el.className = "font-semibold text-dark/40";
            }
        }

        // ===== СЛУШАЕМ ОБНОВЛЕНИЯ =====
        window.addEventListener('storage', (e) => {
            if (e.key === 'wiki_categories' || e.key === 'mugivara_main_data') {
                const loaded = loadWikiFromStorage();
                if (loaded) {
                    renderAllSidebars();
                    const navItem = document.querySelector(`.nav-item[data-page="${currentPage}"]`);
                    if (navItem && sectionsMap[currentPage]) {
                        loadWikiPage(currentPage);
                    } else {
                        loadFirstAvailablePage();
                    }
                    const date = new Date();
                    const dateStr = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
                    document.getElementById('update-date').textContent = dateStr;
                    document.getElementById('mobile-update-date').textContent = dateStr;
                }
            }
        });

        // ============================================================
        // ====== ИНИЦИАЛИЗАЦИЯ ======
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('mobile-menu-button').addEventListener('click', toggleMobileMenu);
            initWiki();
            setTimeout(updateOnline, 300);
            setInterval(updateOnline, 10000);
            setTimeout(checkWikiUpdates, 5000);
            setInterval(checkWikiUpdates, 30000);
        });
    </script>
</body>
