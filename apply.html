<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{var t=localStorage.getItem("mugivara-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подача заявки — Mugivara</title>
    <meta name="description" content="Заполните анкету для доступа на ванильный сервер Mugivara.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=optional" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>html,body{background:#0a0a0b;margin:0;padding:0;}html[data-theme="light"],html[data-theme="light"] body{background:#f7f9fb;color:#14181d;}#navbar-host{display:block;height:57.6px;}</style>

    <link rel="stylesheet" href="assets/style.css">
    <style>
        .form-wrap { max-width: 44rem; margin: 0 auto; }
        .form-group { margin-bottom: 1.4rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.95rem; }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group textarea {
            width: 100%; padding: 0.75rem 1rem; background: var(--background);
            border: 1px solid var(--border); border-radius: 10px; color: var(--foreground);
            font-size: 0.95rem; font-family: inherit; transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 15%, transparent);
        }
        .form-group textarea { min-height: 84px; resize: vertical; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 0.7rem; padding: 0.4rem 0; }
        .checkbox-group input { width: 20px; height: 20px; accent-color: var(--primary); margin-top: 0.2rem; flex-shrink: 0; }
        .custom-select { position: relative; cursor: pointer; }
        .custom-select .selected {
            display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem;
            background: var(--background); border: 1px solid var(--border); border-radius: 10px;
            color: var(--muted-foreground); font-size: 0.95rem; transition: border-color 0.3s ease;
        }
        .custom-select.open .selected { border-color: var(--primary); }
        .custom-select .selected .value-text { color: var(--foreground); }
        .custom-select .options {
            position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 100;
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            max-height: 0; overflow: hidden; opacity: 0; transform: translateY(-6px);
            transition: all 0.3s ease; box-shadow: 0 12px 32px var(--shadow);
        }
        .custom-select.open .options { max-height: 300px; opacity: 1; transform: none; }
        .custom-select .options .option {
            padding: 0.7rem 1rem; color: var(--muted-foreground); display: flex; align-items: center; gap: 0.7rem;
            border-bottom: 1px solid var(--border); cursor: pointer; font-size: 0.9rem; transition: background 0.2s ease;
        }
        .custom-select .options .option:last-child { border-bottom: none; }
        .custom-select .options .option:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); color: var(--primary); }
        .custom-select .options .option i { width: 22px; text-align: center; color: var(--muted-foreground); }
        .form-status { margin-top: 1rem; padding: 0.9rem 1.1rem; border-radius: 10px; display: none; font-size: 0.9rem; }
        .form-status.error { display: block; background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.3); color: var(--foreground); }
        .form-status.success { display: block; background: color-mix(in srgb, var(--primary) 12%, transparent); border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent); }
        .submit-btn { width: 100%; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="navbar-host"></div>

    <section class="section">
        <div class="container form-wrap">
            <div style="text-align:center;margin-bottom:2rem;">
                <h1 class="section-title"><i class="fas fa-pen-to-square" style="color:var(--primary);"></i> Подача заявки</h1>
                <p class="section-sub">Заполните анкету для получения доступа на сервер</p>
                <div style="font-size:0.8rem;color:var(--muted-foreground);margin-top:-1rem;">
                    <i class="fas fa-circle-check" style="color:var(--primary);"></i>
                    Если не получилось, включи VPN или напиши: @v0ufer
                </div>
            </div>

            <div class="card reveal">
                <form id="applyForm" onsubmit="submitApplication(event)">
                    <div class="form-group">
                        <label for="minecraft_nick">1. Твой игровой ник (Minecraft) <span style="color:var(--primary);">*</span></label>
                        <input type="text" id="minecraft_nick" placeholder="Например: PlayerName" required>
                    </div>
                    <div class="form-group">
                        <label for="age">2. Твой возраст <span style="color:var(--primary);">*</span></label>
                        <input type="number" id="age" placeholder="Например: 16" min="8" max="99" required>
                    </div>
                    <div class="form-group">
                        <label for="how_found">3. Как ты узнал о нас? <span style="color:var(--primary);">*</span></label>
                        <div class="custom-select" id="howFoundSelect">
                            <div class="selected" onclick="toggleSelect()">
                                <span id="selectedText" class="placeholder">Выберите вариант...</span>
                                <span><i class="fas fa-chevron-down"></i></span>
                            </div>
                            <div class="options">
                                <div class="option" data-value="discord" onclick="selectOption('discord')"><i class="fab fa-discord"></i> Discord</div>
                                <div class="option" data-value="tiktok" onclick="selectOption('tiktok')"><i class="fab fa-tiktok"></i> TikTok</div>
                                <div class="option" data-value="youtube" onclick="selectOption('youtube')"><i class="fab fa-youtube"></i> YouTube</div>
                                <div class="option" data-value="friend" onclick="selectOption('friend')"><i class="fas fa-users"></i> От друзей</div>
                                <div class="option" data-value="other" onclick="selectOption('other')"><i class="fas fa-ellipsis"></i> Другое</div>
                            </div>
                        </div>
                        <input type="hidden" id="how_found" value="">
                    </div>
                    <div class="form-group">
                        <label for="experience">4. Есть ли опыт игры на хардкорных/ванильных серверах? <span style="color:var(--primary);">*</span></label>
                        <textarea id="experience" placeholder="Расскажи о своем опыте..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="expectations">5. Чего ты ждёшь от MugiwaraCraft? <span style="color:var(--primary);">*</span></label>
                        <textarea id="expectations" placeholder="Что ты хочешь найти на нашем сервере?" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>6. Подтверждаешь ознакомление с Кодексом Мугивар? <span style="color:var(--primary);">*</span></label>
                        <div class="checkbox-group">
                            <input type="checkbox" id="rules_agree" required>
                            <label for="rules_agree" style="font-weight:400;margin:0;cursor:pointer;">Да, я ознакомился(ась) с <a href="rules.html" target="_blank">правилами сервера</a> и обязуюсь их соблюдать</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="discord_nick">7. Оставь дс/тг/вк для связи <span style="color:var(--primary);">*</span></label>
                        <input type="text" id="discord_nick" placeholder="@твойник" required>
                        <div style="font-size:0.75rem;color:var(--muted-foreground);margin-top:4px;">Например: @player123</div>
                    </div>
                    <button type="submit" class="btn btn-primary submit-btn" id="submitBtn">
                        <i class="fas fa-paper-plane"></i> Отправить заявку
                    </button>
                    <div id="formStatus" class="form-status"></div>
                </form>
            </div>
        </div>
    </section>

    <div id="footer-host"></div>

    <script>
        (function() {
            const JSONBIN_API_KEY = '$2a$10$URKtwmPsnoAKHj1hYcx0uuaUNwhJzV..m9zBM5rRKfsTFJYCJAFPe';
            const JSONBIN_BIN_ID = '6a5b75a4f5f4af5e29a06b2e';

            window.toggleSelect = function() {
                const s = document.getElementById('howFoundSelect');
                s.classList.toggle('open');
            };
            window.selectOption = function(value) {
                const options = document.querySelectorAll('.options .option');
                const stub = document.getElementById('selectedText');
                options.forEach(o => o.classList.remove('selected-option'));
                const sel = document.querySelector('.options .option[data-value="' + value + '"]');
                if (sel) {
                    stub.textContent = sel.textContent.trim();
                    stub.classList.add('value-text');
                    document.getElementById('how_found').value = value;
                }
                document.getElementById('howFoundSelect').classList.remove('open');
            };
            document.addEventListener('click', e => {
                const s = document.getElementById('howFoundSelect');
                if (s && !s.contains(e.target)) s.classList.remove('open');
            });

            window.submitApplication = async function(event) {
                event.preventDefault();
                const status = document.getElementById('formStatus');
                const btn = document.getElementById('submitBtn');
                const g = id => document.getElementById(id);
                const data = {
                    id: Date.now().toString(36) + Math.random().toString(36).substring(2, 7),
                    date: new Date().toISOString(), status: 'pending',
                    minecraft_nick: g('minecraft_nick').value.trim(),
                    age: g('age').value.trim(),
                    how_found: g('how_found').value,
                    experience: g('experience').value.trim(),
                    expectations: g('expectations').value.trim(),
                    rules_agree: g('rules_agree').checked,
                    discord_nick: g('discord_nick').value.trim()
                };
                if (!data.minecraft_nick || !data.age || !data.how_found || !data.experience || !data.expectations || !data.discord_nick) {
                    status.textContent = '❌ Пожалуйста, заполните все обязательные поля'; status.className = 'form-status error'; return;
                }
                if (!data.rules_agree) { status.textContent = '❌ Подтвердите ознакомление с правилами'; status.className = 'form-status error'; return; }
                if (parseInt(data.age) < 8 || parseInt(data.age) > 99) { status.textContent = '❌ Укажите возраст от 8 до 99 лет'; status.className = 'form-status error'; return; }
                btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Отправка...';
                try {
                    let applications = [];
                    try { const s = localStorage.getItem('mugivara_applications'); if (s) applications = JSON.parse(s); } catch (e) {}
                    applications.push(data);
                    localStorage.setItem('mugivara_applications', JSON.stringify(applications));
                    try {
                        const mainData = localStorage.getItem('mugivara_main_data');
                        let main = mainData ? JSON.parse(mainData) : {};
                        main.applications = applications;
                        localStorage.setItem('mugivara_main_data', JSON.stringify(main));
                    } catch (e) {}
                    try {
                        const c = new AbortController(); const t = setTimeout(() => c.abort(), 5000);
                        const r = await fetch('https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID + '/latest', { headers: { 'X-Master-Key': JSONBIN_API_KEY }, signal: c.signal });
                        clearTimeout(t);
                        if (r.ok) {
                            const cd = (await r.json()).record || {};
                            let cloudApps = cd.applications || [];
                            cloudApps.push(data); cd.applications = cloudApps; cd.updated = new Date().toISOString();
                            await fetch('https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY }, body: JSON.stringify(cd) });
                        }
                    } catch (e) {}
                    status.textContent = '✅ Заявка успешно отправлена! Ожидайте рассмотрения в течение 24 часов.';
                    status.className = 'form-status success';
                    event.target.reset();
                    document.getElementById('selectedText').textContent = 'Выберите вариант...';
                    document.getElementById('selectedText').classList.remove('value-text');
                    document.getElementById('how_found').value = '';
                    window.showToast ? window.showToast('Заявка отправлена!') : null;
                } catch (e) {
                    status.textContent = '⚠️ Заявка сохранена локально. Проверьте интернет-соединение.'; status.className = 'form-status error';
                }
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Отправить заявку'; btn.disabled = false;
            };
        })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"></script>
    <script src="assets/main.js"></script>
</body>
</html>
