<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{var t=localStorage.getItem("mugivara-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта мира — Mugivara</title>
    <meta name="description" content="Онлайн-карта мира ванильного сервера Mugivara (Dynmap).">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=optional" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>html,body{background:#0a0a0b;margin:0;padding:0;}html[data-theme="light"],html[data-theme="light"] body{background:#f7f9fb;color:#14181d;}#navbar-host{display:block;height:57.6px;}</style>

    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div id="navbar-host"></div>

    <section class="section">
        <div class="container" style="max-width:40rem;text-align:center;">
            <div class="card reveal">
                <div style="width:86px;height:86px;border-radius:50%;background:color-mix(in srgb,var(--primary) 10%,transparent);border:2px solid color-mix(in srgb,var(--primary) 20%,transparent);display:inline-flex;align-items:center;justify-content:center;margin-bottom:1.2rem;">
                    <i class="fas fa-map" style="font-size:2.2rem;color:var(--primary);"></i>
                </div>
                <h1 class="section-title">Карта мира</h1>
                <p class="text-muted" style="font-size:1.05rem;">Просмотр мира в реальном времени</p>
                <div style="display:flex;align-items:center;justify-content:center;gap:0.7rem;margin-top:0.8rem;color:var(--muted-foreground);font-size:0.8rem;flex-wrap:wrap;">
                    <span class="badge"><i class="fas fa-sync-alt"></i> Dynmap</span>
                    <span><i class="fas fa-clock"></i> Обновляется в реальном времени</span>
                </div>
                <div style="margin-top:2rem;">
                    <a href="http://map.mugivaracraft.ru:25981/" target="_blank" class="btn btn-primary" style="font-size:1rem;padding:0.85rem 2rem;">
                        <i class="fas fa-map"></i> Открыть карту <i class="fas fa-arrow-right" style="font-size:0.8rem;opacity:0.7;"></i>
                    </a>
                </div>
                <div style="margin-top:1.2rem;color:var(--muted-foreground);font-size:0.85rem;">
                    <i class="fas fa-window-restore"></i> Карта открывается в новой вкладке
                    <div style="opacity:0.7;font-size:0.75rem;margin-top:2px;">(так работает стабильнее всего)</div>
                </div>
                <div style="display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:2rem;color:var(--muted-foreground);font-size:0.8rem;">
                    <span><i class="fas fa-check-circle" style="color:var(--primary);"></i> Онлайн-карта</span>
                    <span style="width:1px;height:16px;background:var(--border);"></span>
                    <span><i class="fas fa-clock" style="color:var(--primary);"></i> Реальное время</span>
                    <span style="width:1px;height:16px;background:var(--border);"></span>
                    <span><i class="fas fa-compass" style="color:var(--primary);"></i> Dynmap</span>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-host"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"></script>
    <script src="assets/main.js"></script>
</body>
</html>
