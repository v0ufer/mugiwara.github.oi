<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{var t=localStorage.getItem("mugivara-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Правила — Mugivara</title>
    <meta name="description" content="Кодекс Мугивар — правила ванильного сервера Mugivara.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=optional" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>html,body{background:#0a0a0b;margin:0;padding:0;}html[data-theme="light"],html[data-theme="light"] body{background:#f7f9fb;color:#14181d;}#navbar-host{display:block;height:57.6px;}</style>

    <link rel="stylesheet" href="assets/style.css">
    <style>
        .rules-wrap { max-width: 52rem; margin: 0 auto; }
        .rule-section { border: 1px solid var(--border); border-radius: 14px; background: var(--card); margin-bottom: 1.2rem; overflow: hidden; }
        .rule-section-head { padding: 1.1rem 1.4rem; display: flex; align-items: center; gap: 0.9rem; border-bottom: 1px solid var(--border); }
        .rule-num { width: 2.2rem; height: 2.2rem; border-radius: 10px; background: var(--primary); color: var(--primary-foreground); display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
        .rule-section-body { padding: 0.6rem 1.4rem 1rem; }
        .rule-item { display: flex; gap: 0.7rem; padding: 0.6rem 0; color: var(--muted-foreground); font-size: 0.92rem; align-items: flex-start; }
        .rule-item i { color: var(--primary); margin-top: 0.2rem; font-size: 0.85rem; }
        .sync-bar { display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap; margin: 1.5rem 0 2.5rem; color: var(--muted-foreground); font-size: 0.85rem; }
        .sync-btn { padding: 0.3rem 0.9rem; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground); cursor: pointer; font-size: 0.8rem; }
        .sync-btn:hover { border-color: var(--primary); color: var(--primary); }
        .rule-cat-title { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; margin: 2rem 0 1rem; font-size: 1.2rem; }
        @media (prefers-reduced-motion: reduce) { .rule-section { margin-bottom: 1.2rem; } }
    </style>
</head>
<body>
    <div id="navbar-host"></div>

    <section class="section">
        <div class="container rules-wrap">
            <div style="text-align:center;" class="reveal">
                <h1 class="section-title">Кодекс Мугивар</h1>
                <p class="section-sub">Правила ванильного сервера · чистое выживание без PvP</p>
            </div>

            <div class="sync-bar">
                <span id="sync-status"><i class="fas fa-check-circle" style="color:var(--primary);"></i> Синхронизировано с облаком</span>
                <button onclick="loadAllRulesFromCloud()" class="sync-btn"><i class="fas fa-cloud-upload-alt"></i> Обновить</button>
            </div>

            <div id="rulesContainer"></div>

            <div style="text-align:center;margin-top:2.5rem;color:var(--muted-foreground);font-style:italic;font-size:0.9rem;">
                <p>Нарушение правил может повлечь предупреждение, мут или бан.</p>
                <p style="margin-top:0.3rem;">Береги себя и других. Играй честно <i class="fas fa-hand-peace" style="color:var(--primary);"></i></p>
            </div>
        </div>
    </section>

    <div id="footer-host"></div>

    <script>
        (function() {
            const JSONBIN_API_KEY = '$2a$10$URKtwmPsnoAKHj1hYcx0uuaUNwhJzV..m9zBM5rRKfsTFJYCJAFPe';
            const JSONBIN_BIN_ID = '6a5b75a4f5f4af5e29a06b2e';

            let rulesCategories = [];
            let flatRulesItems = [];

            function flattenRules() {
                flatRulesItems = [];
                rulesCategories.forEach(cat => {
                    (cat.sections || []).forEach(sec => {
                        flatRulesItems.push({
                            id: sec.id, title: sec.title || 'Без названия',
                            items: sec.items || [], category: cat.title || 'Без категории'
                        });
                    });
                });
            }

            function loadRulesFromStorage() {
                try {
                    const mainData = localStorage.getItem('mugivara_main_data');
                    if (mainData) {
                        const data = JSON.parse(mainData);
                        if (data.rulesCategories && data.rulesCategories.length > 0) {
                            rulesCategories = data.rulesCategories; flattenRules(); return true;
                        }
                    }
                } catch (e) {}
                try {
                    const data = localStorage.getItem('rules_categories');
                    if (data) { rulesCategories = JSON.parse(data); if (rulesCategories.length) { flattenRules(); return true; } }
                } catch (e) {}
                return false;
            }

            function saveRulesToStorage() {
                try {
                    localStorage.setItem('rules_categories', JSON.stringify(rulesCategories));
                    const mainData = localStorage.getItem('mugivara_main_data');
                    let data = mainData ? JSON.parse(mainData) : {};
                    data.rulesCategories = rulesCategories;
                    localStorage.setItem('mugivara_main_data', JSON.stringify(data));
                } catch (e) {}
            }

            function getDefaultRulesCategories() {
                return [
                    {
                        id: 'rules_cat1', title: 'Общие правила',
                        sections: [
                            { id: 'rules1', title: 'Нарушения имущества', items: [
                                'Использование чужих ферм без разрешения владельца',
                                'Использование чужих трейдхоллов без разрешения',
                                'Действия с чужой территорией без согласия (радиус 50 блоков от построек)',
                                'Действия с чужими хранилищами без согласия',
                                'Принудительный обмен ресурсами',
                                'Разрушение чужих хранилищ с целью навредить',
                                'Гриферство в любом виде без соглашения'
                            ] },
                            { id: 'rules2', title: 'Общение в игре и Discord', items: [
                                'Личные оскорбления и переход на личности',
                                'Флуд, спам, крик (капс) без причины',
                                'Обсуждение политики, религии и провокационных тем',
                                'Доксинг (распространение личных данных)',
                                'Ложные доносы и обман администрации'
                            ] }
                        ]
                    },
                    {
                        id: 'rules_cat2', title: 'Административные нарушения',
                        sections: [
                            { id: 'rules3', title: 'Наказания', items: [
                                'Предупреждение — за незначительные нарушения',
                                'Мут — за нарушения в чате (от 10 минут до 7 дней)',
                                'Бан — за гриферство, повторные нарушения, обход блокировок'
                            ] }
                        ]
                    }
                ];
            }

            function renderRules() {
                const container = document.getElementById('rulesContainer');
                if (!flatRulesItems.length) {
                    container.innerHTML = '<div class="card p-8" style="text-align:center;color:var(--muted-foreground);">Правила пока не добавлены.</div>';
                    return;
                }
                const grouped = {};
                flatRulesItems.forEach(item => {
                    if (!grouped[item.category]) grouped[item.category] = [];
                    grouped[item.category].push(item);
                });
                const catIcons = { 'Общие правила': 'fa-users', 'Административные нарушения': 'fa-gavel' };
                let html = ''; let globalIndex = 0;
                Object.keys(grouped).forEach(cat => {
                    html += '<div class="rule-cat-title"><i class="fas ' + (catIcons[cat] || 'fa-tag') + '" style="color:var(--primary);"></i>' + cat + '</div>';
                    grouped[cat].forEach(sec => {
                        globalIndex++;
                        html += '<div class="rule-section"><div class="rule-section-head"><span class="rule-num">' + globalIndex + '</span><div style="font-weight:700;">' + sec.title + '</div></div><div class="rule-section-body">';
                        if (sec.items && sec.items.length) {
                            html += sec.items.map(it => '<div class="rule-item"><i class="fas fa-circle-check"></i><span>' + it + '</span></div>').join('');
                        } else {
                            html += '<div style="color:var(--muted-foreground);font-style:italic;font-size:0.85rem;">Пункты отсутствуют</div>';
                        }
                        html += '</div></div>';
                    });
                });
                container.innerHTML = html;
            }

            function updateSyncStatus(synced) {
                const el = document.getElementById('sync-status');
                if (synced) el.innerHTML = '<i class="fas fa-check-circle" style="color:var(--primary);"></i> Синхронизировано с облаком';
                else el.innerHTML = '<i class="fas fa-exclamation-circle" style="color:#e0a100;"></i> Нет связи с облаком';
            }

            async function loadAllRulesFromCloud() {
                const btn = event && event.target && event.target.closest ? event.target.closest('.sync-btn') : null;
                const original = btn ? btn.innerHTML : '';
                if (btn) { btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true; }
                try {
                    const c = new AbortController(); const t = setTimeout(() => c.abort(), 6000);
                    const r = await fetch('https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID + '/latest', { headers: { 'X-Master-Key': JSONBIN_API_KEY }, signal: c.signal });
                    clearTimeout(t);
                    if (!r.ok) throw new Error();
                    const d = await r.json(); const cd = d.record;
                    if (cd && cd.rulesCategories && cd.rulesCategories.length) {
                        rulesCategories = cd.rulesCategories; flattenRules(); saveRulesToStorage();
                        renderRules(); updateSyncStatus(true);
                        window.showToast ? window.showToast('Правила обновлены из облака') : alert('Обновлено');
                    } else {
                        window.showToast ? window.showToast('В облаке нет данных правил') : alert('Нет данных');
                    }
                } catch (e) { updateSyncStatus(false); }
                if (btn) { btn.innerHTML = original; btn.disabled = false; }
            }

            async function checkRulesUpdates() {
                try {
                    const c = new AbortController(); const t = setTimeout(() => c.abort(), 6000);
                    const r = await fetch('https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID + '/latest', { headers: { 'X-Master-Key': JSONBIN_API_KEY }, signal: c.signal });
                    clearTimeout(t);
                    if (!r.ok) return;
                    const d = await r.json(); const cd = d.record;
                    if (cd && cd.rulesCategories && cd.rulesCategories.length) {
                        rulesCategories = cd.rulesCategories; flattenRules(); saveRulesToStorage(); renderRules(); updateSyncStatus(true);
                    } else updateSyncStatus(true);
                } catch (e) { updateSyncStatus(false); }
            }

            function init() {
                const loaded = loadRulesFromStorage();
                if (!loaded) { rulesCategories = getDefaultRulesCategories(); flattenRules(); saveRulesToStorage(); }
                renderRules(); updateSyncStatus(true);
            }

            window.addEventListener('storage', e => {
                if (e.key === 'rules_categories' || e.key === 'mugivara_main_data' || e.key === 'admin_rules_sections') {
                    if (loadRulesFromStorage()) { renderRules(); updateSyncStatus(true); }
                }
            });

            document.addEventListener('DOMContentLoaded', () => {
                init();
                setTimeout(checkRulesUpdates, 5000);
                setInterval(checkRulesUpdates, 30000);
            });
        })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"></script>
    <script src="assets/main.js"></script>
</body>
</html>
